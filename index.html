<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genealogía y Blog - Altimiras Chile</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #2c2c2c;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --accent: #d4af37;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }

        .contenedor {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            font-size: clamp(2rem, 1.5rem + 1vw, 2.5rem);
            color: #ffffff;
            margin: 0 0 10px 0;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.05rem;
        }

        /* Lista de entradas dinámica */
        .lista-entradas {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tarjeta-entrada {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .tarjeta-entrada:hover {
            transform: translateY(-3px);
            background-color: #252525;
            border-color: #444444;
        }

        .tarjeta-entrada h2 {
            font-size: 1.35rem;
            color: #ffffff;
            margin: 0 0 8px 0;
        }

        .fecha-entrada {
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 10px;
            display: block;
        }

        .tarjeta-entrada p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 20px;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <header>
            <h1>Genealogía y Blog</h1>
            <p>Temas de interés, relatos y memorias ordenadas cronológicamente.</p>
        </header>

        <main id="listaEntradas" class="lista-entradas">
            <div class="loading">Cargando entradas desde el repositorio...</div>
        </main>

        <footer>
            <p>&copy; 2026 Altimiras Chile</p>
        </footer>
    </div>

    <script>
        // CONFIGURACIÓN: Reemplaza esto con tu usuario y el nombre de tu repositorio en GitHub
        const GITHUB_REPO = "tu-usuario/tu-repositorio"; 

        async function cargarEntradasDinamicas() {
            const contenedor = document.getElementById('listaEntradas');
            
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/entradas`);
                if (!response.ok) throw new Error('No se pudo conectar con el repositorio.');
                
                const files = await response.json();
                
                // Filtrar solo los archivos que terminan en .html
                const htmlFiles = files.filter(file => file.name && file.name.endsWith('.html'));
                
                if (htmlFiles.length === 0) {
                    contenedor.innerHTML = '<p class="loading">No hay entradas disponibles por el momento.</p>';
                    return;
                }

                // Ordenar de más reciente a más antiguo basándose en el nombre (ej: 2022-05-18_...)
                htmlFiles.sort((a, b) => b.name.localeCompare(a.name));

                let htmlTarjetas = '';

                htmlFiles.forEach(file => {
                    // Extraer fecha y título del nombre del archivo (Formato: YYYY-MM-DD_titulo_de_prueba.html)
                    const cleanName = file.name.replace('.html', '');
                    const parts = cleanName.split('_');
                    const fecha = parts[0] || 'Fecha desconocida';
                    
                    // Reconstruir el título legible a partir del resto del nombre del archivo
                    const slugTitulo = parts.slice(1).join(' ');
                    const titulo = slugTitulo ? slugTitulo.charAt(0).toUpperCase() + slugTitulo.slice(1).replace(/_/g, ' ') : cleanName;

                    htmlTarjetas += `
                        <a href="entradas/${file.name}" class="tarjeta-entrada">
                            <span class="fecha-entrada">${fecha}</span>
                            <h2>${titulo}</h2>
                            <p>Haz clic para leer el artículo completo...</p>
                        </a>
                    `;
                });

                contenedor.innerHTML = htmlTarjetas;

            } catch (error) {
                console.error(error);
                contenedor.innerHTML = '<p class="loading" style="color: #c5221f;">Error al cargar las entradas dinámicamente.</p>';
            }
        }

        cargarEntradasDinamicas();
    </script>

</body>
</html>
