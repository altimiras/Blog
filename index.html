<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genealogía y Blog - Altimiras Chile</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #2c2c2c;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --accent: #d4af37;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }

        .contenedor {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            font-size: clamp(2rem, 1.5rem + 1vw, 2.5rem);
            color: #ffffff;
            margin: 0 0 10px 0;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.05rem;
        }

        .lista-entradas {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tarjeta-entrada {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            gap: 20px;
            align-items: center;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .tarjeta-entrada:hover {
            transform: translateY(-3px);
            background-color: #252525;
            border-color: #444444;
        }

        .tarjeta-miniatura {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #2c2c2c;
            flex-shrink: 0;
        }

        .tarjeta-info {
            flex-grow: 1;
        }

        .tarjeta-entrada h2 {
            font-size: 1.25rem;
            color: #ffffff;
            margin: 0 0 6px 0;
        }

        .fecha-entrada {
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 6px;
            display: block;
        }

        .tarjeta-entrada p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 20px;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <header>
            <h1>Genealogía y Blog</h1>
            <p>Temas de interés, relatos y memorias.</p>
        </header>

        <main id="listaEntradas" class="lista-entradas">
            <div class="loading">Cargando entradas...</div>
        </main>

        <footer>
            <p>&copy; 2026 Altimiras Chile</p>
        </footer>
    </div>

    <script>
        // CONFIGURACIÓN: Tu repositorio actual
        const GITHUB_REPO = "altimiras/Blog";

        async function cargarEntradasDinamicas() {
            const contenedor = document.getElementById('listaEntradas');
            
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/Entradas`);
                if (!response.ok) throw new Error('No se pudo conectar con el repositorio.');
                
                const files = await response.json();
                const htmlFiles = files.filter(file => file.name && file.name.endsWith('.html'));
                
                if (htmlFiles.length === 0) {
                    contenedor.innerHTML = '<p class="loading">No hay entradas disponibles.</p>';
                    return;
                }

                // Ordenar de más reciente a más antiguo por nombre de archivo
                htmlFiles.sort((a, b) => b.name.localeCompare(a.name));

                let htmlTarjetas = '';

                for (const file of htmlFiles) {
                    // Extraer la fecha del nombre del archivo (Primeros 10 caracteres: YYYY-MM-DD)
                    const fecha = file.name.substring(0, 10);

                    // Extraer el título limpio reemplazando guiones bajos por espacios y quitando la extensión
                    const nombreLimpio = file.name.replace('.html', '').substring(11); 
                    const titulo = decodeURIComponent(nombreLimpio.replace(/_/g, ' '));

                    let miniatura = '';

                    try {
                        const resHtml = await fetch(`Entradas/${file.name}`);
                        const textoHtml = await resHtml.text();
                        
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(textoHtml, 'text/html');

                        // Buscar la primera imagen dentro del artículo
                        const imgTag = doc.querySelector('img');
                        if (imgTag) {
                            let srcOriginal = imgTag.getAttribute('src');
                            // Si la ruta es relativa y no empieza con http o una barra, ajustarla a la carpeta Entradas/
                            if (srcOriginal && !srcOriginal.startsWith('http') && !srcOriginal.startsWith('/')) {
                                miniatura = `Entradas/${srcOriginal}`;
                            } else {
                                miniatura = srcOriginal;
                            }
                        }
                    } catch (e) {
                        console.error("No se pudo extraer la imagen de:", file.name);
                    }

                    // Renderizar la tarjeta incluyendo la miniatura si se encontró
                    htmlTarjetas += `
                        <a href="Entradas/${file.name}" class="tarjeta-entrada">
                            ${miniatura ? `<img src="${miniatura}" class="tarjeta-miniatura" alt="Miniatura">` : ''}
                            <div class="tarjeta-info">
                                <span class="fecha-entrada">${fecha}</span>
                                <h2>${titulo}</h2>
                                <p>Haz clic para leer el artículo completo...</p>
                            </div>
                        </a>
                    `;
                }

                contenedor.innerHTML = htmlTarjetas;

            } catch (error) {
                console.error(error);
                contenedor.innerHTML = '<p class="loading" style="color: #c5221f;">Error al cargar las entradas dinámicamente.</p>';
            }
        }

        cargarEntradasDinamicas();
    </script>

</body>
</html>
