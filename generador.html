<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Entradas - Altimiras Chile</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #2c2c2c;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --accent: #d4af37;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }

        .contenedor {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
        }

        h1 {
            color: #ffffff;
            margin-top: 0;
            font-size: 1.8rem;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-weight: 500;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background-color: #121212;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            background-color: var(--accent);
            color: #121212;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .resultado-seccion {
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        pre {
            background-color: #121212;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            color: #a8ff60;
            font-size: 0.85rem;
            max-height: 250px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Generador de Entradas para el Blog</h1>
        <p style="color: var(--text-muted);">Completa los datos de tu entrada de Blogger y genera el código HTML listo para tu web.</p>

        <div class="campo">
            <label for="titulo">Título de la Entrada:</label>
            <input type="text" id="titulo" placeholder="Ej: Memorias de Santiago">
        </div>

        <div class="campo">
            <label for="fecha">Fecha:</label>
            <input type="text" id="fecha" value="17 de septiembre, 2026">
        </div>

        <div class="campo">
            <label for="imagen">Nombre del archivo de la foto (en carpeta Fot/):</label>
            <input type="text" id="imagen" placeholder="Ej: foto1.jpg">
        </div>

        <div class="campo">
            <label for="texto">Contenido (puedes pegar texto o etiquetas HTML simples):</label>
            <textarea id="texto" placeholder="Pega aquí el texto de tu entrada..."></textarea>
        </div>

        <button onclick="generarCodigo()">Generar y Descargar Código</button>

        <div class="resultado-seccion">
            <label>Vista previa del código generado:</label>
            <pre id="salida">El código aparecerá aquí cuando hagas clic en el botón...</pre>
        </div>
    </div>

    <script>
        function generarCodigo() {
            const titulo = document.getElementById('titulo').value;
            const fecha = document.getElementById('fecha').value;
            const imagen = document.getElementById('imagen').value;
            const texto = document.getElementById('texto').value;

            // Procesar saltos de línea para convertirlos en párrafos limpios si pegas texto plano
            const parrafos = texto.split('\n').filter(p => p.trim() !== '').map(p => `                <p>${p}</p>`).join('\n');

            const plantillaHtml = `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${titulo} - Altimiras Chile</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #2c2c2c;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --accent: #d4af37;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            margin: 0;
            padding: 40px 20px;
        }
        .contenedor-articulo {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .volver {
            display: inline-block;
            margin-bottom: 25px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.95rem;
        }
        .volver:hover { opacity: 0.8; }
        h1 {
            font-size: clamp(1.8rem, 1.5rem + 1vw, 2.4rem);
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .fecha {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        .foto-principal {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }
        .contenido p {
            margin-bottom: 20px;
            font-size: 1.05rem;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <main class="contenedor-articulo">
        <a href="../index.html" class="volver">&larr; Volver al índice</a>
        <article>
            <h1>${titulo}</h1>
            <div class="fecha">Publicado el ${fecha}</div>
            <img src="../Fot/${imagen}" alt="Fotografía representativa" class="foto-principal">
            <div class="contenido">
${parrafos}
            </div>
        </article>
    </main>
    <footer>
        <p>&copy; 2026 Altimiras Chile</p>
    </footer>
</body>
</html>`;

            document.getElementById('salida').textContent = plantillaHtml;

            // Opcional: crea y descarga automáticamente el archivo HTML
            const blob = new Blob([plantillaHtml], { type: 'text/html' });
            const enlace = document.createElement('a');
            enlace.href = URL.createObjectURL(blob);
            enlace.download = 'entrada.html';
            enlace.click();
        }
    </script>
</body>
</html>
