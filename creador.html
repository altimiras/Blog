<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Entradas - Blog</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #2c2c2c;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --accent: #d4af37;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px 20px;
            max-width: 700px;
            margin: 0 auto;
        }
        h1 { color: #fff; font-size: 1.8rem; margin-bottom: 20px; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-weight: bold;
        }
        input[type="text"], input[type="date"], textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        textarea {
            height: 200px;
            resize: vertical;
        }
        button {
            background-color: var(--accent);
            color: #121212;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .resultado {
            margin-top: 30px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
        }
        code {
            display: block;
            background: #121212;
            padding: 10px;
            border-radius: 5px;
            color: #a6e22e;
            font-family: monospace;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>Generador de Entradas para el Blog</h1>
    
    <div class="form-group">
        <label for="fecha">Fecha de la entrada:</label>
        <input type="date" id="fecha">
    </div>

    <div class="form-group">
        <label for="titulo">Título de la entrada:</label>
        <input type="text" id="titulo" placeholder="Ej: Memorias de la Estación">
    </div>

    <div class="form-group">
        <label for="urlFoto">URL de la foto (miniatura y portada):</label>
        <input type="text" id="urlFoto" placeholder="https://ejemplo.com/imagen.jpg">
    </div>

    <div class="form-group">
        <label for="contenido">Texto / Contenido (puedes usar etiquetas HTML básicas como &lt;p&gt;, &lt;br&gt;, &lt;h2&gt;):</label>
        <textarea id="contenido" placeholder="Escribe o pega tu texto aquí..."></textarea>
    </div>

    <button onclick="generarArchivo()">Generar y Descargar Archivo</button>

    <div class="resultado" id="infoResultado" style="display:none;">
        <label>Nombre de archivo sugerido para guardar en la carpeta 📁 Entradas:</label>
        <code id="nombreArchivoSalida"></code>
        <p style="font-size: 0.9rem; color: var(--text-muted);">¡El archivo se ha descargado automáticamente! Solo súbelo a tu repositorio de GitHub dentro de la carpeta <b>Entradas</b>.</p>
    </div>

    <script>
        // Poner la fecha de hoy por defecto
        document.getElementById('fecha').valueAsDate = new Date();

        function generarArchivo() {
            const fecha = document.getElementById('fecha').value;
            const titulo = document.getElementById('titulo').value.trim();
            const urlFoto = document.getElementById('urlFoto').value.trim();
            const contenido = document.getElementById('contenido').value.trim();

            if (!titulo || !fecha) {
                alert("Por favor completa al menos la fecha y el título.");
                return;
            }

            // Limpiar el título para crear un nombre de archivo válido (reemplazar espacios por guiones bajos)
            const tituloLimpio = titulo.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s]/g, "").replace(/\s+/g, "_");
            const nombreArchivo = `${fecha}_${tituloLimpio}.html`;

            // Estructura limpia de la página de la entrada con diseño coherente con tu blog
            const plantillaHtml = `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${titulo} - Altimiras Chile</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #2c2c2c;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --accent: #d4af37;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
            margin: 0;
            padding: 40px 20px;
        }
        .contenedor {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
        }
        .volver {
            display: inline-block;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .volver:hover { text-decoration: underline; }
        .fecha {
            font-size: 0.9rem;
            color: var(--accent);
            display: block;
            margin-bottom: 10px;
        }
        h1 {
            font-size: clamp(1.8rem, 1.4rem + 1vw, 2.3rem);
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .imagen-principal {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .contenido-texto p {
            margin-bottom: 20px;
            color: var(--text-main);
        }
        footer {
            text-align: center;
            margin-top: 50px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <a href="../index.html" class="volver">&larr; Volver al inicio</a>
        <span class="fecha">${fecha}</span>
        <h1>${titulo}</h1>
        
        ${urlFoto ? `<img src="${urlFoto}" alt="${titulo}" class="imagen-principal">` : ''}

        <div class="contenido-texto">
            ${contenido.split('\n').map(parrafo => parrafo.trim() ? `<p>${parrafo}</p>` : '').join('')}
        </div>

        <footer>
            <p>&copy; 2026 Altimiras Chile</p>
        </footer>
    </div>

</body>
</html>`;

            // Crear archivo para descarga automática
            const blob = new Blob([plantillaHtml], { type: 'text/html;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = nombreArchivo;
            link.click();

            // Mostrar instrucción visual
            document.getElementById('nombreArchivoSalida').innerText = nombreArchivo;
            document.getElementById('infoResultado').style.display = 'block';
        }
    </script>

</body>
</html>
