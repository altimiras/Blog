<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Masivo de Blogger - Altimiras Chile</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #2c2c2c;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --accent: #d4af37;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }
        .contenedor {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        h1 { color: #ffffff; margin-top: 0; font-size: 1.8rem; }
        p { color: var(--text-muted); }
        .zona-carga {
            border: 2px dashed var(--border-color);
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            margin: 25px 0;
            background-color: #161616;
        }
        input[type="file"] { color: var(--text-main); margin-top: 10px; }
        .lista-resultados {
            margin-top: 25px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            background-color: #161616;
        }
        .item-entrada {
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-accion {
            background-color: var(--accent);
            color: #121212;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        .btn-accion:hover { opacity: 0.9; }
        .oculto { display: none; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Conversor Masivo de Blogger (Feed Atom / XML)</h1>
        <p>Selecciona el archivo <strong>feed.atom</strong> que encontraste en tu exportación de Takeout.</p>

        <div class="zona-carga">
            <label for="archivoXml" style="display:block; color: #fff; font-weight: 500; margin-bottom: 10px;">Sube tu archivo feed.atom:</label>
            <input type="file" id="archivoXml" accept=".atom,.xml">
        </div>

        <div id="seccionProgreso" class="oculto">
            <p id="estadoCarga" style="color: var(--accent); font-weight: bold;"></p>
            <div class="lista-resultados" id="listaEntradas"></div>
            <button class="btn-accion" onclick="descargarTodo()">Generar y Descargar Todas las Entradas e Índice</button>
        </div>
    </div>

    <script>
        let entradasProcesadas = [];

        document.getElementById('archivoXml').addEventListener('change', function(evento) {
            const archivo = evento.target.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e) {
                const contenidoXml = e.target.result;
                parsearXmlBlogger(contenidoXml);
            };
            lector.readAsText(archivo);
        });

        function parsearXmlBlogger(xmlTexto) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlTexto, "text/xml");
            
            const entries = xmlDoc.getElementsByTagName('entry');
            entradasProcesadas = [];

            for (let entry of entries) {
                const titleNode = entry.getElementsByTagName('title')[0];
                const contentNode = entry.getElementsByTagName('content')[0];
                const publishedNode = entry.getElementsByTagName('published')[0] || entry.getElementsByTagName('issued')[0];

                if (titleNode && contentNode) {
                    const titulo = titleNode.textContent;
                    const contenidoHtml = contentNode.textContent;
                    const fechaCruda = publishedNode ? publishedNode.textContent : '';
                    
                    let fechaLegible = "Reciente";
                    if (fechaCruda) {
                        const d = new Date(fechaCruda);
                        if (!isNaN(d)) {
                            fechaLegible = d.toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });
                        }
                    }

                    // Extraer primera imagen
                    let imagenUrl = "";
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = contenidoHtml;
                    const primeraImg = tempDiv.querySelector('img');
                    if (primeraImg) {
                        imagenUrl = primeraImg.src;
                    }

                    const textoPlano = tempDiv.textContent || tempDiv.innerText || "";
                    const descripcion = textoPlano.substring(0, 120) + "...";

                    const slug = titulo.toLowerCase()
                        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                        .replace(/[^a-z0-9]/g, '-')
                        .replace(/-+/g, '-');

                    entradasProcesadas.push({
                        titulo: titulo,
                        fecha: fechaLegible,
                        contenido: contenidoHtml,
                        imagen: imagenUrl,
                        descripcion: descripcion,
                        nombreArchivo: slug + ".html"
                    });
                }
            }

            const seccion = document.getElementById('seccionProgreso');
            const lista = document.getElementById('listaEntradas');
            const estado = document.getElementById('estadoCarga');

            seccion.classList.remove('oculto');
            estado.textContent = `¡Se encontraron ${entradasProcesadas.length} entradas en el archivo Atom!`;
            
            lista.innerHTML = '';
            entradasProcesadas.forEach((item, index) => {
                lista.innerHTML += `<div class="item-entrada"><span><strong>${index+1}.</strong> ${item.titulo}</span> <span style="color:var(--text-muted); font-size:0.8rem;">${item.nombreArchivo}</span></div>`;
            });
        }

        function descargarTodo() {
            if (entradasProcesadas.length === 0) return;

            let htmlIndex = `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genealogía y Blog - Altimiras Chile</title>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --border-color: #2c2c2c; --text-main: #e0e0e0; --text-muted: #9e9e9e; --accent: #d4af37; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 40px 20px; }
        .contenedor { max-width: 800px; margin: 0 auto; }
        header { margin-bottom: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .volver-inicio { color: var(--accent); text-decoration: none; display: inline-block; margin-bottom: 15px; }
        h1 { color: #ffffff; margin: 0 0 10px 0; }
        .lista-entradas { display: flex; flex-direction: column; gap: 20px; }
        .tarjeta-entrada { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; text-decoration: none; color: inherit; transition: 0.2s; display: block; }
        .tarjeta-entrada:hover { background-color: #252525; border-color: #444; }
        .tarjeta-entrada h2 { color: #ffffff; margin: 0 0 8px 0; font-size: 1.3rem; }
        .fecha-entrada { font-size: 0.85rem; color: var(--accent); margin-bottom: 8px; display: block; }
        .tarjeta-entrada p { color: var(--text-muted); margin: 0; font-size: 0.95rem; }
        footer { text-align: center; margin-top: 60px; color: var(--text-muted); font-size: 0.9rem; border-top: 1px solid var(--border-color); padding-top: 25px; }
    </style>
</head>
<body>
    <div class="contenedor">
        <header>
            <a href="https://altimiras.github.io/" class="volver-inicio">&larr; Volver al sitio principal</a>
            <h1>Genealogía y Blog</h1>
            <p>Temas de interés, relatos y memorias migradas desde Blogger.</p>
        </header>
        <main class="lista-entradas">`;

            entradasProcesadas.forEach(entrada => {
                htmlIndex += `
            <a href="entradas/${entrada.nombreArchivo}" class="tarjeta-entrada">
                <span class="fecha-entrada">${entrada.fecha}</span>
                <h2>${entrada.titulo}</h2>
                <p>${entrada.descripcion}</p>
            </a>`;

                const htmlArticulo = `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${entrada.titulo} - Altimiras Chile</title>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --border-color: #2c2c2c; --text-main: #e0e0e0; --text-muted: #9e9e9e; --accent: #d4af37; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.7; margin: 0; padding: 40px 20px; }
        .contenedor-articulo { max-width: 800px; margin: 0 auto; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .volver { display: inline-block; margin-bottom: 25px; color: var(--accent); text-decoration: none; }
        h1 { color: #ffffff; margin-top: 0; margin-bottom: 10px; font-size: 2.2rem; }
        .fecha { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .foto-principal { width: 100%; max-height: 400px; object-fit: cover; border-radius: 10px; margin-bottom: 25px; border: 1px solid var(--border-color); }
        .contenido p { margin-bottom: 20px; font-size: 1.05rem; }
        .contenido img { max-width: 100%; height: auto; border-radius: 8px; margin: 15px 0; }
        footer { text-align: center; margin-top: 50px; color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>
    <main class="contenedor-articulo">
        <a href="../index.html" class="volver">&larr; Volver al índice</a>
        <article>
            <h1>${entrada.titulo}</h1>
            <div class="fecha">Publicado el ${entrada.fecha}</div>
            ${entrada.imagen ? `<img src="${entrada.imagen}" alt="Fotografía representativa" class="foto-principal">` : ''}
            <div class="contenido">
                ${entrada.contenido}
            </div>
        </article>
    </main>
    <footer><p>&copy; 2026 Altimiras Chile</p></footer>
</body>
</html>`;

                const blobArt = new Blob([htmlArticulo], { type: 'text/html' });
                const linkArt = document.createElement('a');
                linkArt.href = URL.createObjectURL(blobArt);
                linkArt.download = entrada.nombreArchivo;
                linkArt.click();
            });

            htmlIndex += `
        </main>
        <footer><p>&copy; 2026 Altimiras Chile</p></footer>
    </div>
</body>
</html>`;

            setTimeout(() => {
                const blobIdx = new Blob([htmlIndex], { type: 'text/html' });
                const linkIdx = document.createElement('a');
                linkIdx.href = URL.createObjectURL(blobIdx);
                linkIdx.download = 'index.html';
                linkIdx.click();
                alert("¡Listo! Se han procesado todas las entradas desde tu archivo feed.atom.");
            }, 1000);
        }
    </script>
</body>
</html>
